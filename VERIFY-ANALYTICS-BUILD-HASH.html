<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Build Hash Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f7;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1d1d1f;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056cc;
        }
        .hash-display {
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Analytics Build Hash Checker</h1>
        
        <div class="info">
            <strong>Purpose:</strong> This tool checks which Analytics Dashboard build is currently loaded in your browser.
        </div>

        <div id="results"></div>

        <button onclick="checkBuildHash()">Check Current Build Hash</button>
        <button onclick="window.location.reload(true)">Hard Refresh & Check</button>
        <button onclick="clearCacheAndCheck()">Clear Cache & Check</button>

        <div class="info" style="margin-top: 30px;">
            <strong>Expected Results:</strong><br>
            ✅ <strong>GOOD:</strong> AnalyticsDashboard-B8gPwN8Z.js (NEW - with TDZ fixes)<br>
            ❌ <strong>BAD:</strong> AnalyticsDashboard-B6x0QrGh.js (OLD - has bugs)
        </div>
    </div>

    <script>
        function checkBuildHash() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">Checking loaded scripts...</div>';

            // Get all script tags
            const scripts = Array.from(document.scripts);
            const analyticsScripts = scripts.filter(script => 
                script.src && script.src.includes('AnalyticsDashboard')
            );

            if (analyticsScripts.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <strong>❌ No Analytics Dashboard scripts found!</strong><br>
                        This means you're not on the Analytics Dashboard page, or the scripts failed to load.
                    </div>
                `;
                return;
            }

            let html = '';
            analyticsScripts.forEach(script => {
                const src = script.src;
                const filename = src.split('/').pop();
                
                if (filename.includes('B8gPwN8Z')) {
                    html += `
                        <div class="success">
                            <strong>✅ SUCCESS: New build detected!</strong><br>
                            <div class="hash-display">${filename}</div>
                            The TDZ and router fixes are now active. Test the dashboard!
                        </div>
                    `;
                } else if (filename.includes('B6x0QrGh')) {
                    html += `
                        <div class="error">
                            <strong>❌ ERROR: Old build still loading!</strong><br>
                            <div class="hash-display">${filename}</div>
                            You need to clear your browser cache. The fixes are NOT active.
                        </div>
                    `;
                } else {
                    html += `
                        <div class="info">
                            <strong>ℹ️ Unknown build detected:</strong><br>
                            <div class="hash-display">${filename}</div>
                            This might be a different version. Check if errors persist.
                        </div>
                    `;
                }
            });

            resultsDiv.innerHTML = html;
        }

        function clearCacheAndCheck() {
            // Clear various caches
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => {
                        caches.delete(name);
                    });
                });
            }
            
            // Force reload
            window.location.reload(true);
        }

        // Auto-check on page load
        window.addEventListener('load', () => {
            setTimeout(checkBuildHash, 1000);
        });
    </script>
</body>
</html>
