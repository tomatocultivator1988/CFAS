<!DOCTYPE html>
<html>
<head>
    <title>Test AI DOCX Import</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test AI DOCX Import</h1>
    
    <div class="section">
        <h2>Step 1: Login</h2>
        <button onclick="login()">Login as Admin</button>
        <div id="loginResult" class="result" style="display:none;"></div>
    </div>
    
    <div class="section">
        <h2>Step 2: Upload DOCX</h2>
        <input type="file" id="fileInput" accept=".docx" />
        <button onclick="uploadDocx()" id="uploadBtn" disabled>Upload & Parse</button>
        <div id="uploadResult" class="result" style="display:none;"></div>
    </div>
    
    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        let authToken = '';
        let examId = '';
        
        async function login() {
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (data.data && data.data.token) {
                    authToken = data.data.token;
                    
                    // Get first exam
                    const examsResponse = await fetch(`${API_URL}/admin/exams`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    const examsData = await examsResponse.json();
                    examId = examsData.exams[0].id;
                    
                    document.getElementById('loginResult').innerHTML = `
                        <div class="success">
                            <strong>✓ Login successful!</strong><br>
                            Token: ${authToken.substring(0, 20)}...<br>
                            Exam ID: ${examId}
                        </div>
                    `;
                    document.getElementById('loginResult').style.display = 'block';
                    document.getElementById('uploadBtn').disabled = false;
                } else {
                    throw new Error('Login failed');
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = `
                    <div class="error"><strong>✗ Error:</strong> ${error.message}</div>
                `;
                document.getElementById('loginResult').style.display = 'block';
            }
        }
        
        async function uploadDocx() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first');
                return;
            }
            
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.innerHTML = '<div>⏳ Uploading and parsing... (this may take 20-30 seconds)</div>';
            resultDiv.style.display = 'block';
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('exam_id', examId);
                
                const response = await fetch(`${API_URL}/admin/questions/import-docx`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✓ Success!</strong><br>
                            Questions parsed: ${data.count}<br>
                            Message: ${data.message}<br><br>
                            <strong>First Question:</strong><br>
                            <pre>${JSON.stringify(data.questions[0], null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <strong>✗ Error:</strong> ${data.message}<br>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error"><strong>✗ Error:</strong> ${error.message}</div>
                `;
            }
        }
    </script>
</body>
</html>
